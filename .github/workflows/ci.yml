name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy: "preview" (channel next) or "live" (the real site, functions, rules)'
        required: true
        default: preview
        type: choice
        options: [preview, live]

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:locales
      - run: pnpm test
      - run: pnpm build
      - name: Performance budget (initial JavaScript under 250 KB gzipped)
        run: pnpm check:budget
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Security rules tests (Firestore emulator)
        run: pnpm test:rules
      - name: Vercel server tests (auth and Firestore emulators)
        run: pnpm test:api
      - name: Playwright journeys (1280 px and 400 px, axe, parity, 4G LCP, under the CSP)
        run: |
          pnpm --filter @afb/web exec playwright install --with-deps chromium
          pnpm --filter @afb/web e2e
      - name: Account, contribution, API, dataset and alert journeys (emulators)
        run: pnpm e2e:auth
      - name: Seed an empty database and check every collection
        run: pnpm exec firebase emulators:exec --only firestore --project demo-cottid "pnpm seed:emulator && pnpm seed:emulator && pnpm exec tsx tools/count-emulator.ts"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  # Every push to main (and a manual "preview" run) publishes to the Hosting preview channel "next".
  deploy-preview:
    needs: check
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COTTID_72D51 != '' }}
    steps:
      - name: Skip when the Firebase secret is not set yet
        if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT_COTTID_72D51 is not set; the Firebase preview deploy is skipped (Vercel still deploys main). Run 'pnpm firebase init hosting:github' to add it."
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE_SECRET == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_FIREBASE_SECRET == 'true'
        with:
          name: web-dist
          path: apps/web/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SECRET == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COTTID_72D51 }}
          projectId: cottid-72d51
          channelId: next
          expires: 30d

  # The live site, functions, rules and indexes: only when someone runs the workflow by hand with
  # target "live", and only after the "production" environment's reviewers approve (set them in GitHub).
  deploy-live:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'live' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COTTID_72D51 }}
      - name: Deploy hosting, functions, Firestore rules and indexes, Storage rules
        run: pnpm exec firebase deploy --project cottid-72d51 --only hosting,functions,firestore,storage --non-interactive --force
