name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:locales
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Security rules tests (Firestore emulator)
        run: pnpm test:rules
      - name: Playwright journeys (1280 px and 400 px, axe, parity)
        run: |
          pnpm --filter @afb/web exec playwright install --with-deps chromium
          pnpm --filter @afb/web e2e
      - name: Account journeys (Auth, Firestore and Functions emulators)
        run: pnpm e2e:auth
      - name: Seed an empty database and check every collection
        run: pnpm exec firebase emulators:exec --only firestore --project demo-cottid "pnpm seed:emulator && pnpm seed:emulator && pnpm exec tsx tools/count-emulator.ts"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  deploy:
    # Until parity (M4), main deploys to the Hosting preview channel "next", never over the live site.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COTTID_72D51 }}
          projectId: cottid-72d51
          channelId: next
          expires: 30d
